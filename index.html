<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1b7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Undercover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Undercover</title>
<style>
:root{--bg:#09090c;--surface:rgba(255,255,255,.04);--text:#f3f3f6;--muted:#8d8d9b;--line:rgba(255,255,255,.1);--accent:#e5484d;--danger:#e5484d;--c0:#2fd08a;--c1:#f2b705;--c2:#ff8a3d;--c3:#e5484d;--a1:#ff4d5e;--a2:#ff8a3d;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:dark}
body[data-theme="0"]{--a1:#ff5fa2;--a2:#8b5cf6}
body[data-theme="1"]{--a1:#ffb020;--a2:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bl{position:absolute;border-radius:50%;filter:blur(80px);opacity:.38;transition:background 1s}
.b1{width:70vmax;height:70vmax;left:-30vmax;top:-30vmax;background:var(--a1);animation:d1 19s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-30vmax;top:30vh;background:var(--a2);animation:d2 23s ease-in-out infinite alternate}
.b3{width:50vmax;height:50vmax;left:10vmax;bottom:-30vmax;background:#4361ee;opacity:.28;animation:d1 27s ease-in-out infinite alternate-reverse}
@keyframes d1{from{transform:translate(0,0) scale(1)}to{transform:translate(14vmax,10vmax) scale(1.2)}}
@keyframes d2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-12vmax,-8vmax) scale(.9)}}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
.stage{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:440px;text-align:center;padding:24px 20px 22px;border-radius:22px;background:rgba(18,18,24,.78);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.card.hero{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:10px 0}
.enter{animation:enter .55s cubic-bezier(.22,1,.36,1) both}
.leaving{animation:leave .36s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-10px) scale(1.02)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

h1{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.35rem;margin:10px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.95rem;line-height:1.45;margin:6px 0 16px}
.label{text-align:left;font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.rule{font-size:.85rem;color:var(--muted);text-align:left;margin:10px 2px 0;line-height:1.4}
.warn{color:var(--danger)}

/* intro */
.intro{padding:30px 0}
.kicker{font-family:var(--mono);font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:fade .8s .1s both}
.title{font-size:clamp(2.1rem,11vw,3.4rem);font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 0;line-height:1;background:linear-gradient(100deg,#fff 30%,var(--a2) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleIn 1s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes titleIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.bar-accent{height:2px;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));margin:22px auto 18px;animation:grow .8s 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{width:84px}}
.tagline{color:var(--muted);font-size:.9rem;animation:fade .8s 1.3s both}

/* boutons */
button{width:100%;font:inherit;font-weight:700;font-size:.92rem;letter-spacing:.01em;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 10px 26px -10px var(--a1);cursor:pointer;margin-top:10px;transition:transform .15s,filter .15s,border-color .2s}
button:active{transform:scale(.98)}
@media (hover:hover){button:hover{filter:brightness(1.1)}}
button.sec{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;box-shadow:none;text-shadow:none}
.snd,.back,.tile,.lv,.seg button{box-shadow:none;text-shadow:none}
.snd{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));right:12px;width:38px;height:38px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center}
.snd svg{display:block}
.back{width:auto;margin:0;padding:8px 4px;background:transparent;color:var(--muted);font-size:.9rem;font-weight:600}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}

/* puces */
.chip{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.topbar .chip{margin-bottom:0}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.dot{width:30px;height:3px;border-radius:2px;background:rgba(255,255,255,.14)}
.dot.done{background:rgba(255,255,255,.45)}
.dot.on{background:linear-gradient(90deg,var(--a1),var(--a2))}

/* choix de catégorie */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{position:relative;overflow:hidden;margin:0;padding:16px 14px;min-height:210px;border-radius:18px;border:1px solid var(--line);background:#101015;color:var(--text);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;will-change:transform,opacity;transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .4s ease,border-color .3s;animation:tileIn .6s cubic-bezier(.2,.8,.2,1) backwards}
.tile::before{content:"";position:absolute;inset:-10%;background:radial-gradient(110% 80% at 100% 0%,var(--tint),transparent 62%),radial-gradient(90% 60% at 0% 100%,var(--tint2),transparent 62%);animation:sweep 6s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translate(0,0) scale(1)}to{transform:translate(-6%,5%) scale(1.12)}}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.tile.t0{--tint:rgba(139,92,246,.62);--tint2:rgba(255,95,162,.4);animation-delay:.05s}
.tile.t1{--tint:rgba(245,158,11,.55);--tint2:rgba(239,68,68,.4);animation-delay:.15s}
.tile .idx{position:absolute;top:8px;right:12px;font-size:4.4rem;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.28);letter-spacing:-.02em;animation:floaty 3.2s ease-in-out infinite alternate}
.tile .ln{position:relative;width:26px;height:2px;background:var(--text);margin-bottom:10px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.tile .tn{position:relative;font-weight:900;letter-spacing:.06em;font-size:1.35rem;text-transform:uppercase}
.tile .ts{position:relative;font-family:var(--mono);font-size:.68rem;font-weight:500;color:var(--muted);letter-spacing:.04em}
@media (hover:hover){.tile:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.3)}.tile:hover .ln{width:60px}}
.tile:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.tiles.sel{pointer-events:none}
.tiles.sel .tile{opacity:0;transform:scale(.92) translateY(8px)}
.tiles.sel .tile.picked{opacity:1;transform:scale(1.04);border-color:var(--text)}
.tiles.sel .tile.picked .ln{width:60px}
@keyframes tileIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

/* paramètres */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);padding:4px;border-radius:13px;border:1px solid var(--line)}
.seg button{margin:0;padding:11px;background:transparent;color:var(--muted);border-radius:9px;font-weight:600}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:700;box-shadow:0 6px 18px -8px var(--a1)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv{margin:0;padding:14px 12px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:98px}
.lv.c0{--lc:var(--c0)}.lv.c1{--lc:var(--c1)}.lv.c2{--lc:var(--c2)}.lv.c3{--lc:var(--c3)}
.lv{transition:transform .2s,border-color .2s,box-shadow .2s}
.lv .t{font-size:1.05rem;font-weight:800}
.lv .d{font-size:.78rem;font-weight:500;color:var(--muted);line-height:1.3}
.pips{display:flex;gap:4px;margin-bottom:4px}
.pip{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.c0 .pip.on{background:var(--c0)}.c1 .pip.on{background:var(--c1)}.c2 .pip.on{background:var(--c2)}.c3 .pip.on{background:var(--c3)}
@media (hover:hover){.lv:hover{border-color:var(--lc);box-shadow:0 8px 24px -12px var(--lc);transform:translateY(-2px)}}
.lv:active{border-color:var(--lc);transform:scale(.98)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nm{width:100%;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);outline:none}
.nm:focus{border-color:var(--a1)}
.nm::placeholder{color:var(--muted);opacity:.7}

/* chargement */
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin:18px 4px 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));animation:fill 1s ease-out forwards}
@keyframes fill{to{width:100%}}

/* partie */
.avatar{position:relative;width:84px;height:84px;border-radius:50%;background:var(--pc);color:#0b0b0e;font-size:2.3rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin:6px auto 14px;box-shadow:0 14px 40px -10px var(--pc);animation:pop .5s cubic-bezier(.2,.9,.3,1.3) backwards}
.avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pc);opacity:0;animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.reveal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 16px;margin:8px 0 16px;animation:pop .45s .1s cubic-bezier(.2,.9,.3,1.1) backwards}
.reveal.bad{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.5)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.reveal.flip{animation:flip .65s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes flip{from{opacity:0;transform:perspective(700px) rotateY(-85deg)}to{opacity:1;transform:perspective(700px) rotateY(0)}}
.reveal>*{transition:filter .6s}
.reveal.lock>*{filter:blur(14px)}
.reveal.lock::after{content:"Et l’Undercover est…";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;letter-spacing:.03em;color:#fff;animation:pulse2 1s ease-in-out infinite alternate}
@keyframes pulse2{from{opacity:.55}to{opacity:1}}
.reveal.unlocked{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.land{animation:land .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes land{from{transform:scale(1.25);opacity:.4}to{transform:none;opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.cf{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),108vh) rotate(720deg);opacity:1}}
.big{font-size:1.9rem;font-weight:800;margin:6px 0;color:var(--text);word-break:break-word;line-height:1.15}
.reveal.bad .big{color:#ff6b70}
.work{font-size:.92rem;font-weight:500;color:var(--muted);margin:0}
.tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== palette claire et colorée ===== */
:root{--text:#fff;--muted:rgba(255,255,255,.78);--surface:rgba(255,255,255,.14);--line:rgba(255,255,255,.28);--ink:#2a1b7a;--card:rgba(25,12,70,.4);--g1:#2a1b7a;--g2:#5a2bb5;--g3:#d6338a}
body[data-theme="0"]{--ink:#4c1d95;--card:rgba(35,15,95,.38);--g1:#2b1a8c;--g2:#7b3ff0;--g3:#f0509e}
body[data-theme="1"]{--ink:#7f1d1d;--card:rgba(70,12,28,.42);--g1:#5a1030;--g2:#c0262d;--g3:#f59e0b}
body{background:#2a1b7a}
.bl{opacity:.55;filter:blur(70px)}
.b3{background:#22d3ee;opacity:.35}
.bg::after{background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px)}
.card{background:var(--card);border-color:var(--line);box-shadow:0 24px 60px rgba(10,0,40,.35)}
.card.hero{background:transparent;border:0;box-shadow:none}
button{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
button.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);box-shadow:none}
.snd,.back,.tile,.lv,.seg button{box-shadow:none}
.snd{background:rgba(255,255,255,.18);color:#fff;border-color:var(--line)}
.back{background:transparent;color:rgba(255,255,255,.88)}
.seg{background:rgba(255,255,255,.12)}
.seg button{background:transparent;color:rgba(255,255,255,.88)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.dot{background:rgba(255,255,255,.25)}.dot.done{background:rgba(255,255,255,.6)}.dot.on{background:#fff}
.chip{color:rgba(255,255,255,.92);border-color:rgba(255,255,255,.38)}
.title{background:linear-gradient(100deg,#fff 40%,#ffd6f0 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar-accent{background:#fff}
.kicker,.tagline{color:rgba(255,255,255,.82)}
.bar{background:rgba(255,255,255,.25)}
.bar i{background:#fff}
.tile{background:linear-gradient(150deg,#ff6ec7,#7c3aed);border-color:rgba(255,255,255,.4)}
.tile.t1{background:linear-gradient(150deg,#ffc53d,#ef4444)}
.tile.t0{--tint:rgba(255,255,255,.35);--tint2:rgba(34,211,238,.4)}
.tile.t1{--tint:rgba(255,255,255,.4);--tint2:rgba(236,72,153,.4)}
.tile .idx{-webkit-text-stroke:1px rgba(255,255,255,.5)}
.tile .ts{color:rgba(255,255,255,.88)}
.tiles.sel .tile.picked{border-color:#fff}
.lv.c0{--lt:rgba(47,208,138,.32)}.lv.c1{--lt:rgba(242,183,5,.3)}.lv.c2{--lt:rgba(255,138,61,.32)}.lv.c3{--lt:rgba(255,77,109,.34)}
.lv{background:linear-gradient(135deg,var(--lt,rgba(255,255,255,.14)),rgba(255,255,255,.08));border-color:rgba(255,255,255,.3)}
.lv .d{color:rgba(255,255,255,.85)}
.pip{background:rgba(255,255,255,.3)}
.nm{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.nm::placeholder{color:rgba(255,255,255,.62);opacity:1}
.nm:focus{border-color:#fff}
.reveal{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32)}
.reveal.bad{background:rgba(239,68,68,.32);border-color:rgba(255,150,150,.85)}
.reveal.bad .big{color:#fff}
.warn{color:#ffc9c9}
.tag,.work{color:rgba(255,255,255,.85)}
.big{text-shadow:0 2px 14px rgba(0,0,0,.25)}

/* ===== fluidité Android : uniquement des animations GPU (opacity / transform) ===== */
.bgl{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;will-change:opacity}
.bgl.n{opacity:1;background:linear-gradient(160deg,#2a1b7a,#5a2bb5 55%,#d6338a)}
.bgl.t0{background:linear-gradient(160deg,#2b1a8c,#7b3ff0 55%,#f0509e)}
.bgl.t1{background:linear-gradient(160deg,#5a1030,#c0262d 55%,#f59e0b)}
body[data-theme="0"] .bgl.t0,body[data-theme="1"] .bgl.t1{opacity:1}
.bl{filter:none!important;transition:none;opacity:1;will-change:transform}
.b1{background:radial-gradient(circle,rgba(255,255,255,.30),transparent 68%)}
.b2{background:radial-gradient(circle,rgba(255,170,230,.34),transparent 68%)}
.b3{background:radial-gradient(circle,rgba(34,211,238,.30),transparent 68%)}
.bg::after{-webkit-mask-image:none;mask-image:none;opacity:.5}
.card{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(rgba(10,0,40,.22),rgba(10,0,40,.22)),var(--card)}
.enter,.leaving{will-change:transform,opacity}
.bar i{width:100%;transform-origin:left;transform:scaleX(0);animation:fillx 1s ease-out forwards}
@keyframes fillx{to{transform:scaleX(1)}}
.reveal>*{transition:opacity .6s}
.reveal.lock>*{filter:none;opacity:0}

/* v2 : ordre de parole, vote, scores */
.ord{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.oc{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-weight:700;font-size:.9rem}
.oc::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc)}
.pvs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.pv{display:flex;flex-direction:column;align-items:center;gap:8px;margin:0;padding:16px 8px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;border-radius:16px}
.pv .av2{width:48px;height:48px;border-radius:50%;background:var(--pc);color:#0b0b0e;font-weight:900;font-size:1.3rem;display:grid;place-items:center}

/* v3 : accueil, mode perso, jeux vidéo */
.hm{right:auto;left:12px;opacity:0;pointer-events:none;transition:opacity .3s}
.hm.on{opacity:1;pointer-events:auto}
.seg.pl{grid-template-columns:repeat(5,1fr)}
.seg.pl button{padding:11px 4px}
.step{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:12px}
.sb{width:52px;height:52px;padding:0;margin:0;border-radius:50%;font-size:1.6rem;line-height:1;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none}
.sv{min-width:64px;font-size:2.2rem;font-weight:900;text-align:center}
.dot{flex:1 1 0;max-width:30px;min-width:3px}
.tile.t2{--tint:rgba(255,255,255,.4);--tint2:rgba(139,92,246,.4);animation-delay:.25s;background:linear-gradient(150deg,#34d399,#0891b2)}
.bgl.t2{background:linear-gradient(160deg,#052e3a,#0e7490 55%,#22d3a0)}
body[data-theme="2"] .bgl.t2{opacity:1}
body[data-theme="2"]{--ink:#064e3b;--card:rgba(4,40,50,.42);--a1:#34d399;--a2:#22d3ee}

/* v4 : mode multi-téléphones */
.code{letter-spacing:.12em;font-size:2.4rem;font-weight:900;font-family:var(--mono)}
.cd{text-align:center;font-size:1.8rem;font-weight:800;letter-spacing:.35em;text-transform:uppercase;margin-top:6px;padding-left:calc(14px + .35em)}

/* finitions */
html{touch-action:manipulation}
body{overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nm{-webkit-user-select:text;user-select:text}
button:focus-visible,.nm:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* admin */
.arow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12);margin-top:8px;text-align:left}
.at{flex:1;min-width:0;font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.al{font-size:.72rem;font-weight:500;color:var(--muted)}
.ib{width:auto;min-width:38px;height:38px;padding:0 8px;margin:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;font-size:.9rem}
.alist{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
.ac{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;text-align:left}
.lv.off{opacity:.35;pointer-events:auto}

/* mode en ligne (salons) */
.rc{font-family:var(--mono);font-size:2.6rem;font-weight:800;letter-spacing:.25em;margin:4px 0 12px;padding-left:.25em}
.ol{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.12);margin-top:8px;text-align:left}
.od{width:10px;height:10px;border-radius:50%;flex:none}
.ol .ox{margin:0 0 0 auto;width:auto;padding:2px 11px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);font-size:1.1rem;box-shadow:none}

/* tchat */
#chat{display:none}
#chat.on{display:block}
#chat button{margin:0;box-shadow:none;text-shadow:none}
#cbtn{position:fixed;z-index:7;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:54px;height:54px;padding:0;border-radius:50%;font-size:1.5rem;line-height:1;background:#fff;color:#000;box-shadow:0 10px 26px -8px rgba(0,0,0,.55)!important}
#cbd{display:none;position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#ff3b5c;color:#fff;font:700 .72rem/22px system-ui,sans-serif;font-style:normal;text-align:center}
#cbd.on{display:block}
#cpan{display:none;position:fixed;z-index:8;left:0;right:0;bottom:0;max-height:72vh;max-height:72dvh;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(22,10,62,.97);border-top:1px solid rgba(255,255,255,.3);border-radius:20px 20px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.4)}
#cpan.open{display:flex;animation:enter .3s cubic-bezier(.22,1,.36,1) both}
.chd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#cx{width:38px;height:38px;padding:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
#clist{flex:1;min-height:30vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.cm{align-self:flex-start;max-width:84%;margin:4px 0;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.14);text-align:left;font-size:.92rem;line-height:1.35;overflow-wrap:anywhere}
.cm b{display:block;font-size:.72rem;margin-bottom:2px}
.cm.me{align-self:flex-end;background:#fff;color:var(--ink)}
.cfm{display:flex;gap:8px;margin-top:10px}
.cfm .nm{flex:1}
#csend{width:auto;padding:0 18px;border-radius:12px;background:#fff;color:var(--ink)}

/* émotes dans le tchat */
#cpan{background:#160a3e}
#cem{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0 2px}
#cem button{flex:none;width:48px;height:48px;padding:2px;border-radius:12px;background:rgba(255,255,255,.1);border:0}
#cem svg,.cm.em svg{display:block;width:100%;height:100%}
@media (hover:hover){#cem button:hover{background:rgba(255,255,255,.25)}}
.cm.em,.cm.em.me{background:none;color:#fff;padding:2px 6px}
.cm.em svg{width:76px;height:76px;margin-top:2px;animation:ebIn .35s cubic-bezier(.2,1.5,.4,1) both}
@keyframes ebIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

#cwarn{display:none;margin:6px 0 0;padding:7px 10px;border-radius:10px;background:rgba(255,90,110,.22);color:#ffd0d6;font-size:.8rem;text-align:center}
#cwarn.on{display:block}
#cem.lock{opacity:.35}
#cem,#cwarn,.cfm,.chd{flex:none}
#clist{min-height:22vh}

.rl{text-align:left;margin:12px 0 0;padding-left:22px;line-height:1.5;font-size:.93rem}
.rl li{margin:9px 0}
.rl b,.rule b{color:#fff}

.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
.avs button{margin:0;padding:5px 0;font-size:1.3rem;line-height:1.35;background:rgba(255,255,255,.12);border:2px solid transparent;border-radius:12px;box-shadow:none;color:#fff;text-shadow:none}
.avs button.on{border-color:#fff;background:rgba(255,255,255,.3)}
.lb .rk{width:30px;text-align:center;font-size:1.15rem;flex:none}
.lb .lbn{flex:1;font-weight:700}
.seg button.off{opacity:.45}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg.s5{grid-template-columns:repeat(5,1fr)}
.seg.s5 button{padding:11px 2px;font-size:.85rem}
.tmv{font-family:var(--mono);font-size:2.2rem;font-weight:800;text-align:center;margin:6px 0 10px}
.tmv.low{color:#ffd166}.tmv.end{color:#ff9a9a}
.seg.s4 button{padding:11px 2px}

.mj{margin-top:10px}
.mjl{margin-top:12px;display:flex;flex-direction:column;gap:9px;text-align:left}
.mji{padding:12px 14px;border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(255,255,255,.12)}
.mjh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mjh b{font-size:.98rem}
.mjd{margin-top:5px;font-size:.85rem;opacity:.88;line-height:1.4}
.mjs{flex:none;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
.mjs.s1{background:#06d6a0;color:#06281f;border-color:#06d6a0;font-weight:800}
.mjs.s2{background:#ffd166;color:#3a2a00;border-color:#ffd166;font-weight:800}

.tile.t3{--tint:rgba(255,255,255,.4);--tint2:rgba(167,139,250,.45);animation-delay:.35s;background:linear-gradient(150deg,#60a5fa,#1e40af)}
.bgl.t3{background:linear-gradient(160deg,#0b1d4a,#1e4fb8 55%,#7cb8ff)}
body[data-theme="3"] .bgl.t3{opacity:1}
body[data-theme="3"]{--ink:#0b2a6b;--card:rgba(10,25,70,.42);--a1:#60a5fa;--a2:#a78bfa}

.tile.t4{--tint:rgba(255,255,255,.4);--tint2:rgba(250,204,21,.45);animation-delay:.45s;background:linear-gradient(150deg,#a3e635,#15803d);grid-column:1/-1;min-height:130px}
.bgl.t4{background:linear-gradient(160deg,#0f3d22,#15803d 55%,#bef264)}
body[data-theme="4"] .bgl.t4{opacity:1}
body[data-theme="4"]{--ink:#14532d;--card:rgba(8,45,25,.42);--a1:#a3e635;--a2:#22c55e}
.seg.sbt{grid-template-columns:1.45fr 1fr 1fr 1fr}
.seg.sbt button{padding:11px 2px;font-size:.8rem;white-space:nowrap}

body[data-skin] .bgl{opacity:0!important}
body[data-skin] .bgl.sk{opacity:1!important}
.bgl.sk{background:linear-gradient(160deg,var(--s1,#0a0508),var(--s2,#3f0b12) 55%,var(--s3,#d0121f))}
.skg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.skn{margin:0;height:62px;padding:8px 10px;border-radius:14px;border:2px solid rgba(255,255,255,.28);background:var(--g);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);font-size:.82rem;font-weight:700;display:flex;align-items:flex-end;justify-content:flex-start;text-align:left;box-shadow:none}
.skn.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.cus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cus label{font-size:.72rem;opacity:.9;display:flex;flex-direction:column;gap:6px;align-items:center}
.cus input{width:100%;height:46px;border:2px solid rgba(255,255,255,.4);border-radius:12px;background:transparent;padding:2px}

/* palette v2.7 : couleurs des catégories */
.tile.t0{background:linear-gradient(150deg,#ff8ad4 0%,#b43cf0 50%,#5a1fb8 100%);--tint:rgba(255,255,255,.34);--tint2:rgba(60,220,255,.28)}

.tile.t3{background:linear-gradient(150deg,#ffd979 0%,#e08a1e 50%,#8a3f0c 100%);--tint:rgba(255,255,255,.36);--tint2:rgba(255,120,60,.3)}
.tile.t4{background:linear-gradient(150deg,#b6f26b 0%,#28b463 50%,#0b6b45 100%);--tint:rgba(255,255,255,.34);--tint2:rgba(250,220,60,.3)}

/* 4. chargement puis partie */
function launch(){
  sfx("ok");vib(15);
  show('<div class="load">'+chip()+'<h2>Chargement…</h2><div class="sub">Distribution des personnages</div><div class="bar"><i></i></div></div>');
  lt=setTimeout(start,1000);
}

function start(){
  var idx;
  var L=pairs();var all=[];L.forEach(function(p,k){if(level(p)===mode){all.push(k);}});
  var pool=all.filter(function(k){return recent.indexOf(WORK[L[k][0]])<0&&recent.indexOf(WORK[L[k][1]])<0;});
  if(!pool.length){pool=all;}
  do{idx=pool[Math.floor(Math.random()*pool.length)];}while(idx===lastPair&&pool.length>1);
  lastPair=idx;recent.push(WORK[L[idx][0]],WORK[L[idx][1]]);recent=recent.slice(-6);
  var pair=L[idx].slice(0,2);
  if(Math.random()<0.5){pair.reverse();}
  if(!bag.length){bag=[];for(var q=0;q<N;q++){bag.push(q);}shuffle(bag);if(bag[bag.length-1]===lastT){bag.reverse();}}
  var traitor=bag.pop();lastT=traitor;
  var w=-1;if(MW&&N>=5){do{w=Math.floor(Math.random()*N);}while(w===traitor);}
  game={civil:pair[0],traitor:pair[1],t:traitor,w:w,i:0,out:[]};
  cover();
}

function cover(){
  show(chip()+dots(game.i)+'<div class="sub" style="margin-bottom:6px">Passe l’écran à</div><div class="avatar" style="--pc:'+PCOL[game.i%12]+'">'+ini(game.i)+'</div><h1 style="color:'+PCOL[game.i%12]+'">'+nm(game.i)+'</h1><div class="sub">Les autres, détournez les yeux !</div><button id="see" type="button">Voir mon personnage</button>');
  document.getElementById("see").onclick=reveal;
}

function reveal(){
  var ch=(game.i===game.t)?game.traitor:game.civil,isW=(game.i===game.w),big=isW?'Mr White':ch,wk=isW?'Tu n’as pas de personnage. Écoute les autres et bluffe pour ne pas te faire repérer.':WORK[ch];
  sfx("ok");vib(12);
  show(chip()+dots(game.i)+'<div class="sub" style="margin-bottom:0"><b style="color:'+PCOL[game.i%12]+'">'+nm(game.i)+'</b>, ton personnage :</div><div class="reveal flip"><div class="big">'+big+'</div><p class="work">'+wk+'</p>'+(isW?'':dsc(ch))+'</div><div class="sub">'+(isW?'Retiens bien ce que diront les autres, puis cache l’écran.':'Mémorise-le, puis cache l’écran.')+'</div><button id="hide" type="button">Cacher et passer</button>');
  document.getElementById("hide").onclick=function(){
    game.i++;
    if(game.i>=N){ready();}else{cover();}
  };
}

function alive(){var a=[],k;for(k=0;k<N;k++){if(game.out.indexOf(k)<0){a.push(k);}}return a;}
function ready(f){
  var al=alive(),first=(f===undefined||al.indexOf(f)<0)?al[Math.floor(Math.random()*al.length)]:f,ord='',k,c=0,q,nx=game.out.length>0;
  game.first=first;
  for(k=0;k<N;k++){q=(first+k)%N;if(game.out.indexOf(q)>=0){continue;}c++;ord+='<span class="oc" style="--pc:'+PCOL[q%12]+'">'+c+' · '+nm(q)+'</span>';}
  show(chip()+(nx?'<div class="tag" style="margin-bottom:6px">Manche '+(game.out.length+1)+' · '+al.length+' joueurs en jeu</div>':'')+'<h1>Que le bluff '+(nx?'continue':'commence')+'</h1><div class="sub">À tour de rôle, dites un mot ou une courte phrase sur votre personnage, sans le nommer.</div><div class="reveal"><div class="tag">Ordre de parole</div><div class="ord">'+ord+'</div></div><button id="vote" type="button">Passer au vote</button>'+(TMS>0?'<button class="sec" id="tm" type="button">Minuteur de débat · '+TMS+' s</button>':'')+'<button class="sec" id="end" type="button">Révéler sans voter</button>');
  document.getElementById("vote").onclick=vote;
  document.getElementById("end").onclick=solution;
  if(TMS>0){document.getElementById("tm").onclick=function(){
    var b=this,t=TMS;clearInterval(tmr);sfx("ok");b.textContent="Débat · "+fm(t);
    tmr=setInterval(function(){
      t--;b.textContent=t>0?"Débat · "+fm(t):"Temps écoulé !";
      if(t<=0){clearInterval(tmr);snd("end");}else if(t<=5){sfx("cd");vib(10);}
    },1000);
  };}
}

function vote(){
  var h='',k;
  for(k=0;k<N;k++){if(game.out.indexOf(k)>=0){continue;}h+='<button type="button" class="pv" data-i="'+k+'" style="--pc:'+PCOL[k%12]+'"><span class="av2">'+ini(k)+'</span>'+nm(k)+'</button>';}
  show(chip()+'<h2>'+(game.w>=0?'Qui est un infiltré'+NB+'?':'Qui est l’Undercover'+NB+'?')+'</h2><div class="sub">'+(game.w>=0?'Undercover ou Mr White : le groupe désigne le suspect le plus voté.':'Le groupe désigne le suspect le plus voté.')+'</div><div class="pvs">'+h+'</div><button class="sec" id="vb" type="button">‹ Retour</button>');
  document.getElementById("vb").onclick=function(){ready(game.first);};
  each(app.querySelectorAll(".pv"),function(b){b.onclick=function(){verdict(+b.getAttribute("data-i"));};});
}

function verdict(i){
  if(i===game.w){
    sfx("ok");vib([20,30]);
    show(chip()+'<div class="tag">'+nm(i)+' est désigné</div><h1>C’était Mr White</h1><div class="sub">Dernière chance : il annonce à voix haute le personnage des Civils. Le groupe vérifie.</div><button id="gy" type="button">Il a trouvé</button><button class="sec" id="gn" type="button">Raté</button>');
    document.getElementById("gy").onclick=function(){finish("w",i);};
    document.getElementById("gn").onclick=function(){out(i);};
    return;
  }
  if(!ELIM&&game.w<0){finish(i===game.t?"civ":"bad",i);return;}
  out(i);
}
function out(i){
  game.out.push(i);
  var al=alive(),uA=game.out.indexOf(game.t)<0,wA=game.w>=0&&game.out.indexOf(game.w)<0;
  if(!uA&&!wA){finish("civ",i);return;}
  if(al.length<=2){finish("bad",i);return;}
  var who=i===game.t?'était l’Undercover':(i===game.w?'était Mr White':'était un Civil'),
      more=(uA&&wA)?'L’Undercover et Mr White sont toujours parmi vous.':(uA?'L’Undercover est toujours parmi vous.':'Mr White est toujours en jeu.'),
      good=(i===game.t||i===game.w);
  snd(good?"reveal":"elim");
  show(chip()+'<div class="tag">'+(good?'Bien vu':'Raté')+'</div><h1>'+nm(i)+' '+who+'</h1><div class="sub">Il est éliminé. '+more+' '+al.length+' joueurs restent en jeu.</div><button id="nx" type="button">Continuer la partie</button>');
  document.getElementById("nx").onclick=function(){ready();};
}
function finish(kind,i){
  var k,uA=game.out.indexOf(game.t)<0,wA=game.w>=0&&game.out.indexOf(game.w)<0,ok=(kind==="civ"),t,sub;
  for(k=0;k<N;k++){
    if(kind==="civ"){if(k!==game.t&&k!==game.w){SC[k]+=1;}}
    else if(kind==="w"){if(k===game.w){SC[k]+=3;}}
    else if((k===game.t&&uA)||(k===game.w&&wA)){SC[k]+=2;}
  }
  if(kind==="civ"){t='Les Civils gagnent'+NB+'!';sub=game.w>=0?'L’Undercover et Mr White sont démasqués.':nm(game.t)+' était bien l’Undercover.';}
  else if(kind==="w"){t='Mr White gagne'+NB+'!';sub=nm(game.w)+' a trouvé le personnage des Civils.';}
  else if(uA&&wA){t='L’Undercover et Mr White gagnent'+NB+'!';sub=nm(game.t)+' (Undercover) et '+nm(game.w)+' (Mr White) gagnent la partie.';}
  else if(wA){t='Mr White gagne'+NB+'!';sub=nm(game.w)+' était Mr White et gagne la partie.';}
  else{t='L’Undercover gagne'+NB+'!';sub=nm(game.t)+' était l’Undercover et gagne la partie.';}
  snd(ok||kind==="w"?"win":"lose");if(ok){confetti();}
  show(chip()+'<div class="tag">'+nm(i)+(kind==="w"?' est Mr White':' est désigné')+'</div><h1 style="color:'+(ok?'#9dffcf':'#ffc9c9')+'">'+t+'</h1><div class="sub">'+sub+'</div><button id="sol" type="button">Voir les personnages</button>');
  document.getElementById("sol").onclick=solution;
}
function hasSc(){var k;for(k=0;k<N;k++){if(SC[k]>0){return true;}}return false;}
function scores(){
  if(!hasSc()){return '';}
  var o=[],k,h='',M=['🥇','🥈','🥉'],r=0,prev=-1;
  for(k=0;k<N;k++){o.push(k);}
  o.sort(function(a,b){return SC[b]-SC[a]||a-b;});
  o.forEach(function(q,j){if(SC[q]!==prev){r=j;prev=SC[q];}h+='<div class="ol lb"><span class="rk">'+(r<3&&SC[q]>0?M[r]:(r+1))+'</span><span class="lbn" style="color:'+PCOL[q%12]+'">'+nm(q)+'</span><span class="tag">'+SC[q]+' pt'+(SC[q]>1?'s':'')+'</span></div>';});
  return '<div class="label">Classement de la soirée</div>'+h+'<div style="height:14px"></div>';
}

function solution(){
  show(chip()+'<h1>Le verdict</h1><div class="reveal"><div class="tag">Civils ('+(N-1-(game.w>=0?1:0))+')</div><div class="big">'+game.civil+'</div><p class="work">'+WORK[game.civil]+'</p></div><div class="reveal bad lock" id="trt"><div class="tag warn">Undercover · '+nm(game.t)+'</div><div class="big">'+game.traitor+'</div><p class="work">'+WORK[game.traitor]+'</p></div>'+(game.w>=0?'<div class="reveal bad"><div class="tag warn">Mr White · '+nm(game.w)+'</div><div class="big">Aucun personnage</div></div>':'')+scores()+'<button id="again" type="button">Nouvelle partie</button><button class="sec" id="menu" type="button">Changer de catégorie</button>'+(hasSc()?'<button class="sec" id="rz" type="button">Remettre le classement à zéro</button>':''));
  document.getElementById("again").onclick=start;
  if(document.getElementById("rz")){document.getElementById("rz").onclick=function(){twice(this,function(){SC=Z();solution();},"Confirmer ?");};}
  document.getElementById("menu").onclick=menu;
  vib(15);
  setTimeout(function(){
    var e=document.getElementById("trt");
    if(e){e.className="reveal bad unlocked";}
    confetti();sfx("ok");vib([30,40,60]);
  },1300);
}

/* ===== mode : chacun son téléphone (code de partie) ===== */
var AL="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function enc(th,lv,n,mw,sb,sd){var v=th|(lv<<3)|(sb<<5)|((n-3)<<7)|((mw?1:0)<<12)|(sd<<13),c="",i;for(i=0;i<5;i++){c=AL.charAt(v%32)+c;v=Math.floor(v/32);}return c;}
function dec(c){
  c=String(c).toUpperCase().replace(/[^2-9A-HJ-NP-Z]/g,"");
  if(c.length!==5){return null;}
  var v=0,i;for(i=0;i<5;i++){v=v*32+AL.indexOf(c.charAt(i));}
  var g={th:v&7,lv:(v>>3)&3,sb:(v>>5)&3,n:((v>>7)&31)+3,mw:((v>>12)&1)===1,sd:v>>13};
  return (g.th>4||g.n>20)?null:g;
}
function rng(sd){var a=(sd*2654435761+12345)>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function deal(g){
  THEME=g.th;
  var R=rng(g.sd),L=pairs(g.th,g.sb),all=[];
  L.forEach(function(p,k){if(level(p)===g.lv){all.push(k);}});
  var p=L[all[Math.floor(R()*all.length)]].slice(0,2);
  if(R()<0.5){p.reverse();}
  var t=Math.floor(R()*g.n),f=Math.floor(R()*g.n),w=-1;
  if(g.mw&&g.n>=5){w=Math.floor(R()*(g.n-1));if(w>=t){w++;}}
  return {civil:p[0],traitor:p[1],t:t,first:f,w:w};
}
function okPairs(g){THEME=g.th;return pairs(g.th,g.sb).some(function(p){return level(p)===g.lv;});}
function mpSet(g){MPG=g;THEME=g.th;SUB=g.sb;mode=g.lv;N=g.n;setTheme(g.th);}
function mdSet(){
  each(app.querySelectorAll(".md button"),function(b){
    b.className=((b.getAttribute("data-m")==="1")===MP)?"on":"";
    b.onclick=function(){MP=(b.getAttribute("data-m")==="1");saveCfg();mdSet();fillPlayers();};
  });
}
function host(){
  mpSet({th:THEME,lv:mode,n:N,mw:MW&&N>=5,sb:SUB,sd:Math.floor(Math.random()*4096)});
  MPG.code=enc(MPG.th,MPG.lv,MPG.n,MPG.mw,MPG.sb,MPG.sd);
  hm(true);sfx("ok");vib(15);
  show(chip()+'<h2>Partie créée</h2><div class="sub">Les autres appuient sur « Rejoindre une partie » dans le menu et tapent ce code.</div><div class="reveal"><div class="tag">Code de la partie</div><div class="big code">'+MPG.code.split("").join(" ")+'</div></div>'+(MPG.mw?'<div class="rule">Mr White est activé dans cette partie.</div>':'')+(DRAFT?'<div class="rule warn">⚠ Brouillon admin actif : les autres joueurs n’ont pas tes modifications.</div>':'')+'<button id="go" type="button">Choisir mon numéro</button><button class="sec" id="shc" type="button">Partager le code</button>');
  document.getElementById("go").onclick=seats;
  document.getElementById("shc").onclick=function(){
    var b=this,t="Rejoins ma partie d’Undercover : ouvre le jeu, touche « Rejoindre un code hors ligne » et entre le code "+MPG.code+".",u=location.href.split("#")[0];
    try{if(navigator.share){navigator.share({title:"Undercover",text:t,url:u}).catch(function(){});return;}}catch(e){}
    try{navigator.clipboard.writeText(t+" "+u).then(function(){flash(b,"Copié ✓");},function(){flash(b,"Copie impossible");});}catch(e){flash(b,"Copie impossible");}
  };
}
function joinScreen(){
  hm(true);setTheme(null);

function applyData(d){while(d.t.length<5){d.t.push([]);}DESC=Object.assign({},DESC0,d.d||{});d.d=DESC;DATA=d;WORK=d.w;}
function admSave(){try{localStorage.setItem("und_draft",JSON.stringify(DATA));}catch(e){}DRAFT=true;}

function admTop(back,chip){return '<div class="topbar"><button class="back" id="back" type="button">‹ '+back+'</button><div class="chip">'+chip+'</div></div>';}
(function(){

  try{var q=JSON.parse(localStorage.getItem("und_pub")||"null");if(validData(q)){applyData(q);}}catch(e){}

  lvl();
  each(g("sg").querySelectorAll("button"),function(b){b.onclick=function(){lv=+b.getAttribute("data-l");lvl();};});
  function sbl(){if(i!==4){return;}each(g("sbs").querySelectorAll("button"),function(b){b.className=(+b.getAttribute("data-b")===sb)?"on":"";});}

var SKIN={id:"cat",c:["#0a0508","#3f0b12","#d0121f"]};
try{var sk0=JSON.parse(localStorage.getItem("und_skin")||"null");if(sk0&&typeof sk0.id==="string"&&Array.isArray(sk0.c)&&sk0.c.length===3&&sk0.c.every(function(x){return /^#[0-9a-fA-F]{6}$/.test(x);})&&SKINS.some(function(z){return z.id===sk0.id;})){SKIN=sk0;}}catch(e){}
function rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function hex(a){return "#"+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?"0":"")+v.toString(16);}).join("");}
function lum(h){var a=rgb(h).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
function clampL(h,mx){var a=rgb(h),i=0;while(lum(hex(a))>mx&&i<60){a=a.map(function(v){return v*0.92;});i++;}return hex(a);}
function mixc(h1,h2,t){var a=rgb(h1),b=rgb(h2);return hex([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);}
function cg(c){return "linear-gradient(160deg,"+c[0]+","+c[1]+" 55%,"+c[2]+")";}
function skinCols(){if(SKIN.id==="custom"){return SKIN.c;}for(var i=0;i<SKINS.length;i++){if(SKINS[i].id===SKIN.id){return SKINS[i].c||null;}}return null;}
function skinMeta(){var c=(SKIN.id==="cat")?null:skinCols();return c?clampL(c[0],0.2):null;}
function skinSave(){try{localStorage.setItem("und_skin",JSON.stringify(SKIN));}catch(e){}}
function applySkin(){try{applySkin0();}catch(e){}}
function applySkin0(){
  var b=document.body,st=b.style,P=["--s1","--s2","--s3","--a1","--a2","--ink","--card"],c=(SKIN.id==="cat")?null:skinCols();
  if(!c){b.removeAttribute("data-skin");P.forEach(function(p){st.removeProperty(p);});}
  else{
    var s1=clampL(c[0],0.1),s2=clampL(c[1],0.25),s3=clampL(c[2],0.6),r=rgb(s1);
    st.setProperty("--s1",s1);st.setProperty("--s2",s2);st.setProperty("--s3",s3);
    st.setProperty("--a1",clampL(c[2],0.28));st.setProperty("--a2",clampL(mixc(c[1],c[2],0.55),0.2));
    st.setProperty("--ink",clampL(c[1],0.06));st.setProperty("--card","rgba("+r[0]+","+r[1]+","+r[2]+",.55)");
    b.setAttribute("data-skin",SKIN.id);
  }
  try{var m=document.querySelector('meta[name="theme-color"]');if(m&&c){m.setAttribute("content",skinMeta());}}catch(e){}
}
applySkin();

let acct=null,rkTab="w",rkCc="",rkTok=0,accTab="new",delArm=false;
const logged=()=>!!(auth&&auth.currentUser&&!auth.currentUser.isAnonymous);
const cleanName=v=>String(v||"").replace(/[<>]/g,"").trim().slice(0,14);
const mail=n=>n.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9_]/g,"")+"@undercover-game.app";
const authMsg=e=>{const c=(e&&e.code)||"";
  if(c==="auth/email-already-in-use"||c==="auth/credential-already-in-use"){return "Ce pseudo est déjà pris.";}
  if(c==="auth/invalid-credential"||c==="auth/user-not-found"||c==="auth/wrong-password"||c==="auth/invalid-email"){return "Pseudo ou mot de passe incorrect.";}
  if(c==="auth/weak-password"){return "Mot de passe trop court (6 caractères minimum).";}
  if(c==="auth/operation-not-allowed"){return "Les comptes ne sont pas activés dans Firebase (Authentication, Sign-in method, E-mail/Mot de passe).";}
  if(c==="auth/network-request-failed"){return "Pas de connexion internet.";}
  if(c==="auth/too-many-requests"){return "Trop d’essais, réessaie dans un moment.";}
  if(c==="auth/requires-recent-login"){return "Déconnecte-toi, reconnecte-toi puis réessaie.";}
  if(c==="PERMISSION_DENIED"||/permission/i.test(c)){return "Le classement n’est pas autorisé par les règles Firebase.";}
  return "Erreur : "+(c||"réseau")+".";};
async function loadAcct(){
  acct=null;if(!logged()){return;}
  const s=await get(ref(db,"lb/"+uid));
  if(s.exists()){acct=s.val();}
  else{const n=cleanName(myName)||"Joueur";const o={n,a:AV[myAv],c:detectCc(),p:0,g:0,w:0};try{await set(ref(db,"lb/"+uid),o);acct=o;}catch(e){acct=null;}}
  if(acct){myName=acct.n;const i=AV.indexOf(acct.a);if(i>=0){myAv=i;}try{localStorage.setItem("ud_name",myName);localStorage.setItem("ud_av",String(myAv));}catch(e){}}
}
async function bank(){
  try{
    if(!logged()||!room||!code){return;}
    const k=code+":"+room.round;let last="";try{last=localStorage.getItem("ud_bank")||"";}catch(e){}
    if(last===k){return;}
    const h=room.hist&&room.hist[room.round];if(!h){return;}
    try{localStorage.setItem("ud_bank",k);}catch(e){}
    if(!acct){await loadAcct();if(!acct){return;}}
    const gain=(h.gu&&h.gu[uid])||0;
    const o={p:(acct.p||0)+gain,g:(acct.g||0)+1,w:(acct.w||0)+(gain>0?1:0)};
    await update(ref(db,"lb/"+uid),o);
    Object.assign(acct,o);
  }catch(e){}
}
async function ranking(){
  if(!rkCc){rkCc=(acct&&acct.c)||detectCc();}
  const tok=++rkTok;
  show(`<div class="topbar"><button class="back" data-a="back" type="button">‹ Retour</button><div class="chip">Classement</div></div><h2>Classement</h2><div class="sub">Chargement…</div>`,"rk");
  let list=[],fail=false;
  try{
    const q=rkTab==="w"?query(ref(db,"lb"),orderByChild("p"),limitToLast(50)):query(ref(db,"lb"),orderByChild("c"),equalTo(rkCc));
    const v=(await get(q)).val()||{};
    list=Object.keys(v).map(k=>Object.assign({id:k},v[k]));
  }catch(e){fail=true;}
  if(tok!==rkTok||!active||code){return;}
  if(rkTab==="c"){list=list.filter(x=>x.c===rkCc);}
  list.sort((a,b)=>(b.p||0)-(a.p||0)||(b.w||0)-(a.w||0));list=list.slice(0,50);
  const M=["🥇","🥈","🥉"];let r=0,prev=-1;
  let h=`<div class="topbar"><button class="back" data-a="back" type="button">‹ Retour</button><div class="chip">Classement</div></div><h2>Classement</h2>
<div class="seg"><button type="button" data-a="rktab" data-v="w" class="${rkTab==="w"?"on":""}">🌍 Monde</button><button type="button" data-a="rktab" data-v="c" class="${rkTab==="c"?"on":""}">${flag(rkCc)} Pays</button></div>`;
  if(rkTab==="c"){h+=`<div class="label">Pays</div>${ctySel("rkc",rkCc)}`;}
  if(fail){h+=`<div class="rule warn">Impossible de charger le classement. Vérifie ta connexion et les règles Firebase.</div>`;}
  else if(!list.length){h+=`<div class="rule">Personne dans ce classement pour l’instant. Crée un compte, joue en ligne et tu seras le premier.</div>`;}
  else{h+=list.map((x,j)=>{const v=x.p||0;if(v!==prev){r=j;prev=v;}return `<div class="ol lb${x.id===uid?" me":""}"><span class="rk">${r<3&&v>0?M[r]:r+1}</span><span class="lbn">${esc(x.a||"")} ${esc(x.n||"?")} <small>${flag(x.c)}</small></span><span class="tag">${v} pt${v>1?"s":""}</span></div>`;}).join("");}
  h+=`<div class="rule">Les points viennent des manches jouées en ligne : +1 pour chaque Civil qui gagne, +2 pour l’Undercover et Mr White, +3 si Mr White trouve le personnage. Seuls les joueurs avec un compte apparaissent.</div><button class="sec" data-a="rkrf">Actualiser</button>`;
  show(h,"rk");
}
function account(){
  rkTok++;
  const top=`<div class="topbar"><button class="back" data-a="back" type="button">‹ Retour</button><div class="chip">Compte</div></div>`;
  if(logged()&&acct){
    const a=acct,pc=a.g?Math.round(100*(a.w||0)/a.g)+" %":"0 %";
    show(top+`<h2>${esc(a.a||"")} ${esc(a.n)}</h2><div class="st3"><div><b>${a.p||0}</b><span>points</span></div><div><b>${a.g||0}</b><span>parties</span></div><div><b>${pc}</b><span>victoires</span></div></div>
<div class="label">Mon pays</div>${ctySel("acc",a.c)}
<div class="rule">Ton pseudo, ton avatar, ton pays et tes points sont visibles dans le classement. Pour changer de pseudo, il faut créer un autre compte.</div>
<div class="rule warn" id="err" role="alert"></div>
<button class="sec" data-a="rk">🏆 Voir le classement</button><button class="sec" data-a="acout">Se déconnecter</button><button class="sec" data-a="acdel">Supprimer mon compte</button>`,"acc");
  }else if(logged()){
    show(top+`<h2>Compte</h2><div class="rule warn">Ton profil de classement n’a pas pu être chargé (règles Firebase ?).</div><button class="sec" data-a="acout">Se déconnecter</button>`,"acc");
  }else{
    const nw=accTab==="new";
    show(top+`<h2>Compte</h2><div class="sub">Facultatif. Un compte garde tes points et te place dans le classement mondial et dans celui de ton pays.</div>
<div class="seg"><button type="button" data-a="acmode" data-v="new" class="${nw?"on":""}">Créer</button><button type="button" data-a="acmode" data-v="in" class="${nw?"":"on"}">Se connecter</button></div>
<div class="label">Pseudo</div><input class="nm" id="ap" maxlength="14" placeholder="Pseudo" autocomplete="username" value="${esc(myName)}">
<div class="label">Mot de passe</div><input class="nm" id="apw" type="password" maxlength="40" placeholder="6 caractères minimum" autocomplete="${nw?"new-password":"current-password"}">
${nw?`<div class="label">Ton pays</div>${ctySel("acc",detectCc())}<div class="rule">Il n’y a pas d’e-mail : si tu oublies ton mot de passe, il ne peut pas être récupéré. Ton pseudo, ton avatar, ton pays et tes points seront visibles dans le classement.</div>`:""}
<div class="rule warn" id="err" role="alert"></div>
<button data-a="${nw?"acnew":"acin"}" style="margin-top:6px">${nw?"Créer mon compte":"Me connecter"}</button>`,"acc"+accTab);
  }
}
async function acAct(a,b){
  if(a==="rk"){rkTab="w";await ranking();}
  else if(a==="rktab"){rkTab=b.dataset.v;await ranking();}
  else if(a==="rkrf"){await ranking();}
  else if(a==="back"){rkTok++;home();}
  else if(a==="acc"){account();}
  else if(a==="acmode"){accTab=b.dataset.v;account();}
  else if(a==="acnew"){
    const n=cleanName($("ap").value),pw=$("apw").value,cc=($("acc")&&$("acc").value)||"FR";
    if(n.length<3||mail(n).split("@")[0].length<3){err("Pseudo : 3 caractères minimum (lettres ou chiffres).");return;}
    if(pw.length<6){err("Mot de passe : 6 caractères minimum.");return;}
    err("Création…");
    try{await linkWithCredential(auth.currentUser,EmailAuthProvider.credential(mail(n),pw));}catch(e){err(authMsg(e));return;}
    uid=auth.currentUser.uid;presOn();myName=n;try{localStorage.setItem("ud_name",n);}catch(e){}
    const o={n,a:AV[myAv],c:cc,p:0,g:0,w:0};
    try{await set(ref(db,"lb/"+uid),o);acct=o;}catch(e){acct=null;}
    account();
  }
  else if(a==="acin"){
    const n=cleanName($("ap").value),pw=$("apw").value;
    if(!n||!pw){err("Entre ton pseudo et ton mot de passe.");return;}
    err("Connexion…");
    try{await signInWithEmailAndPassword(auth,mail(n),pw);}catch(e){err(authMsg(e));return;}
    uid=auth.currentUser.uid;presOn();try{localStorage.removeItem("ud_room");}catch(e){}
    try{await loadAcct();}catch(e){}
    account();
  }
  else if(a==="acout"){
    try{await signOut(auth);const c=await signInAnonymously(auth);uid=(c&&c.user&&c.user.uid)||(auth.currentUser&&auth.currentUser.uid);presOn();}catch(e){}
    acct=null;try{localStorage.removeItem("ud_room");}catch(e){}
    home();
  }
  else if(a==="acdel"){
    if(!delArm){delArm=true;b.textContent="Confirmer la suppression ?";setTimeout(()=>{delArm=false;if(b){b.textContent="Supprimer mon compte";}},3000);return;}
    delArm=false;
    try{await remove(ref(db,"lb/"+uid));await deleteUser(auth.currentUser);}catch(e){err(authMsg(e));return;}
    try{const c=await signInAnonymously(auth);uid=c.user.uid;presOn();}catch(e){}
    acct=null;try{localStorage.removeItem("ud_room");}catch(e){}
    home("","Compte supprimé.");
  }
}
app.addEventListener("change",e=>{
  const t=e&&e.target;if(!t){return;}
  if(t.id==="rkc"){rkCc=t.value;ranking();}
  else if(t.id==="acc"&&logged()&&acct){
    const c=t.value;update(ref(db,"lb/"+uid),{c}).then(()=>{acct.c=c;err("Pays mis à jour.");}).catch(x=>err(authMsg(x)));
  }
});

async function act(a,b){
  const host=room&&room.host===uid;
  if(!code&&["rk","rktab","rkrf","back","acc","acmode","acnew","acin","acout","acdel"].indexOf(a)>=0){await acAct(a,b);return;}
  if(a==="mk"){await createRoom();}
  else if(a==="jn"){await joinRoom();}
  else if(a==="resume"){const c=resumeCode;resumeCode=null;if(c){enter(c);}}
  else if(a==="oc"){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}home("");}
  else if(a==="copy"){
    const url=location.origin+location.pathname+"#"+code;
    if(navigator.share){navigator.share({title:"Undercover",text:"Rejoins mon salon "+code,url}).catch(()=>{});}
    else if(navigator.clipboard){await navigator.clipboard.writeText(url);err("Lien copié.");}
  }
  else if(a==="theme"&&host){await update(ref(db,"rooms/"+code),{theme:+b.dataset.v});}
  else if(a==="level"&&host){await update(ref(db,"rooms/"+code),{level:+b.dataset.v});}
  else if(a==="kick"&&host){await remove(ref(db,`rooms/${code}/players/${b.dataset.id}`));}
  else if(a==="start"&&host){await startRound();}
  else if(a==="again"&&host){await startRound();}
  else if(a==="tog"){shown=!shown;render();}
  else if(a==="hist"){histOpen=!histOpen;snd("tick","tap");render();}
  else if(a==="cancelrec"){recCancel=true;active=false;stop();snd("back");hm(false);menu();}
  else if(a==="tovote"&&host){await update(ref(db,"rooms/"+code),{status:"vote",votes:null});}
  else if(a==="vote"){snd("tick","tap");await set(ref(db,`rooms/${code}/votes/${uid}`),b.dataset.id);}
  else if(a==="reveal"&&host){await revealRound();}
  else if(a==="gy"&&host){await judgeGuess(true);}
  else if(a==="gn"&&host){await judgeGuess(false);}
  else if(a==="sub"&&host){await update(ref(db,"rooms/"+code),{sub:+b.dataset.v});}
  else if(a==="tm"&&host){await update(ref(db,"rooms/"+code),{tm:+b.dataset.v});}
  else if(a==="tgo"&&host){await update(ref(db,"rooms/"+code),{tEnd:srvNow()+(room.tm==null?60:room.tm)*1000});}
  else if(a==="mw"&&host){await update(ref(db,"rooms/"+code),{mw:b.dataset.v==="1"});}
  else if(a==="av"){
    myAv=+b.dataset.v;try{localStorage.setItem("ud_av",String(myAv));}catch(e){}
    if(room&&code&&room.players&&room.players[uid]){await set(ref(db,`rooms/${code}/players/${uid}/av`),AV[myAv]);}
    else{let k=0;app.querySelectorAll(".avs button").forEach(x=>{x.className=(k++===myAv)?"on":"";});}
  }
  else if(a==="rz"&&host){
    if(!rzArm){rzArm=true;b.textContent="Confirmer ?";setTimeout(()=>{rzArm=false;if(b){b.textContent="Remettre le classement à zéro";}},2500);return;}
    rzArm=false;await update(ref(db,"rooms/"+code),{scores:null,hist:null});
  }
  else if(a==="quit"){await quit();}
}
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b){return;}
  act(b.dataset.a,b).catch(x=>{err("Erreur : "+(x&&x.code?x.code:"réseau")+".");});
});

function netUI(){
  let e=$("net");if(!e){e=document.createElement("div");e.id="net";e.setAttribute("role","status");document.body.appendChild(e);}
  clearTimeout(netT);
  if(netUp){
    if(netDown&&code){netDown=false;e.textContent="Reconnecté ✓";e.className="on ok";snd("join");netT=setTimeout(()=>{e.className="";},1600);}
    else{e.className="";}
  }else if(code){
    netT=setTimeout(()=>{if(!netUp&&code){netDown=true;e.textContent="Connexion perdue… reconnexion";e.className="on";}},1500);
  }
}

/* ===== joueurs actifs (présence) ===== */
let pUid=null,pcT="";
function pcShow(n){
  let e=$("pc");if(!e){e=document.createElement("div");e.id="pc";e.setAttribute("role","status");document.body.appendChild(e);}
  if(n<1){e.className="";return;}
  const t=(n>=100?"100+":String(n))+" en ligne";
  if(pcT!==t){pcT=t;e.innerHTML='<i></i>'+t;e.setAttribute("aria-label",t+" actuellement");}
  e.className="on";
}
function presOn(){
  try{
    const u=auth.currentUser;if(!u||document.hidden){return;}
    if(pUid&&pUid!==u.uid){remove(ref(db,"presence/"+pUid)).catch(()=>{});}
    pUid=u.uid;const r=ref(db,"presence/"+pUid);
    onDisconnect(r).remove();set(r,{t:Date.now()}).catch(()=>{});
  }catch(e){}
}
function presOff(){try{if(pUid){remove(ref(db,"presence/"+pUid)).catch(()=>{});}}catch(e){}}
async function initPresence(){
  try{
    await getUser();
    onValue(ref(db,".info/connected"),s=>{if(s.val()){presOn();}});
    onValue(query(ref(db,"presence"),limitToFirst(100)),s=>{pcShow(s.exists()?Object.keys(s.val()).length:0);},()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.hidden){presOff();}else{presOn();}});
  }catch(e){}
}
let uP=null;
function getUser(){
  if(uP){return uP;}
  uP=(async()=>{
    let cu=null;
    try{cu=await new Promise(r=>{let fin=false,un=null;const f=u=>{if(fin){return;}fin=true;try{if(un){un();}}catch(e){}r(u);};un=onAuthStateChanged(auth,f);setTimeout(()=>f(auth.currentUser||null),4000);});}catch(e){cu=null;}
    if(cu){return cu;}
    const c=await signInAnonymously(auth);return c.user;
  })();
  uP.then(()=>{uP=null;},()=>{uP=null;});
  return uP;
}
window.startOnline=function(pre,auto){
resumeCode=null;active=true;key="";recCancel=false;if(window.hm){hm(true);}
let last=null,lt=0;try{last=localStorage.getItem("ud_room");}catch(e){}
show(`<div class="chip">En ligne</div><h1>Undercover</h1><div class="sub">${auto&&last?"Reconnexion au salon "+esc(last)+"…":"Connexion…"}</div>${auto?'<button class="sec" data-a="cancelrec" style="margin-top:14px">Annuler</button>':""}`,"load");
const toMenu=()=>{if(recCancel){return;}active=false;stop();try{localStorage.removeItem("ud_room");}catch(e){}if(window.hm){hm(false);}menu();};
const guard=auto?setTimeout(()=>{if(!code){toMenu();}},9000):0;
getUser().then(async user=>{
  if(recCancel){return;}
  uid=user.uid;
  if(!user.isAnonymous){try{await loadAcct();}catch(e){}}
  try{onValue(ref(db,".info/serverTimeOffset"),s=>{srvOff=+s.val()||0;});}catch(e){}
  try{onValue(ref(db,".info/connected"),s=>{netUp=!!s.val();netUI();});}catch(e){}
  const hash=(pre||location.hash.replace("#","")).toUpperCase().slice(0,4);
  if(last&&(!hash||hash===last)){
    try{
      const s=await get(ref(db,"rooms/"+last));
      if(recCancel){return;}
      if(s.exists()&&s.val().players&&s.val().players[uid]){if(auto||hash===last){clearTimeout(guard);enter(last);return;}resumeCode=last;}
    }catch(e){}
  }
  clearTimeout(guard);
  if(auto){toMenu();return;}
  home(hash);
}).catch(e=>{
  clearTimeout(guard);
  if(auto){toMenu();return;}
  show(`<div class="chip">Erreur</div><h1>Connexion impossible</h1><div class="sub">${esc(e&&e.code||"")}. Vérifie que la connexion anonyme est activée dans Firebase (Authentication, Sign-in method).</div>`,"fail");
});
};
window.onlineStop=function(){active=false;stop();};
initPresence();
(function(){var h=location.hash.replace("#","").toUpperCase();if(/^[A-Z]{4}$/.test(h)){if(window.skipIntro){skipIntro();}window.startOnline(h);return;}
  try{var r=localStorage.getItem("ud_room"),t=+localStorage.getItem("ud_roomT")||0;
    if(window.REC!==false&&/^[A-Z]{4}$/.test(r||"")&&Date.now()-t<10*3600*1000){if(window.skipIntro){skipIntro();}window.startOnline("",true);}}catch(e){}})();
</script>
